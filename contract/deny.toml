# cargo-deny config for the contract workspace (issue #183).
[graph]
targets = [{ triple = "wasm32-unknown-unknown" }, { triple = "x86_64-unknown-linux-gnu" }]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "Zlib"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Two majors of ed25519-dalek in one graph is exactly the failure the vendored
# patch exists to prevent (see Cargo.toml / docs/design/vendored-ed25519.md).
deny = [{ name = "ed25519-dalek", version = ">=3" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
